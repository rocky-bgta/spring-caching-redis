name: Maven unit tests and Docker build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run isolated unit tests
        run: mvn -B -Dtest=ProductServiceTest test

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build Java 17 container image
        run: docker build -t spring-caching-redis:ci .
